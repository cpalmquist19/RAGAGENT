[project]
name = "licn-rag"
version = "0.1.0"
description = "Citation-grounded RAG assistant for NC educator licensure (LICN) policies"
authors = [
    { name = "Caleb Palmquist", email = "cpalmquist19@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "sqlite-vec>=0.1.9",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
licn-ingest = "licn_rag.ingest.cli:main"
licn-silver = "licn_rag.evals.silver:main"
licn-eval = "licn_rag.evals.runner:main"
licn-ask = "licn_rag.ask:main"
licn-index = "licn_rag.rag.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
